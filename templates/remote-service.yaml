name: remote-service
displayName: ""
type: proxy
categories: []
description: API proxy for a remote service
parameters:
  - name: StreamResponse
    description: Determines if the responses are streamed from the targets, or not.
    default: false
endpoints:
  - name: remote-service
    basePath: /remote-service
    routes:
      - name: default
        target: remote-service
    flows:
      - name: PostFlow
        mode: Response
        steps:
          - name: helloworld-JS-AddHelloWorld
    faultRules: []
targets:
  - name: remote-service
    url: https://boomerang-service-323709580283.europe-west1.run.app
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://boomerang-service-323709580283.europe-west1.run.app
policies:
  - name: helloworld-JS-AddHelloWorld
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: helloworld-JS-AddHelloWorld
        displayName: JS-AddHelloWorld
        properties: {}
        resourceUrl: jsc://helloworld-hello-world.js
resources:
  - name: helloworld-hello-world.js
    type: jsc
    content: |-
      var responseText = response.content;
      if (!responseText) responseText = "";

      var responseObject = undefined;

      try {
        responseObject = JSON.parse(responseText);
      } catch(e) {
        print("Could not parse JSON.");
      }

      var message = context.getVariable("request.queryparam.message");
      if (!message)
        message = context.getVariable("propertyset.helloworld-helloworld.MESSAGE");
      if (!message)
        message = "Hello world 11!";

      if (responseObject) {
        responseObject["message"] = message;
        context.setVariable("response.content", JSON.stringify(responseObject));
      } else {
        responseText = responseText + " " + message;
        context.setVariable("response.content", responseText);
      }
  - name: helloworld-helloworld.properties
    type: properties
    content: |
      MESSAGE=Hello world!
tests: []
