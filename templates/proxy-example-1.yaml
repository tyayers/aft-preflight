name: proxy-example-1
displayName: proxy-example-1
type: proxy
gateway: apigee
schemaVersion: 1.0.0
categories: []
description: proxy-example-1
documentation: ""
parameters: []
endpoints:
  - name: default
    basePath: /proxy-example
    routes:
      - name: default
        target: default
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: SC-GetData
      - name: PostFlow
        mode: Response
        steps:
          - name: AM-SetHeaders
          - name: JS-AddResponseData
    faultRules: []
targets:
  - name: default
    url: https://mocktarget.apigee.net
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://mocktarget.apigee.net
policies:
  - name: SC-GetData
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: SC-GetData
        DisplayName: SC-GetData
        Properties: {}
        Request:
          metadata:
            clearPayload: "true"
            variable: myRequest
          IgnoreUnresolvedVariables: "false"
        Response: calloutResponse
        HTTPTargetConnection:
          Properties: {}
          URL: https://jsonplaceholder.typicode.com/todos
  - name: JS-AddResponseData
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-AddResponseData
        DisplayName: JS-AddResponseData
        Properties: {}
        ResourceURL: jsc://Resource-1.js
  - name: AM-SetHeaders
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetHeaders
        DisplayName: AM-SetHeaders
        Properties: {}
        Set:
          Headers:
            Header:
              - metadata:
                  name: x-custom-1
                _text: test header 1
              - metadata:
                  name: x-custom-2
                _text: test header 2
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: response
resources:
  - name: Resource-1.js
    type: jsc
    content: |-
      var todoData = context.getVariable("calloutResponse.content");
      var responseData = response.content.asJSON;

      responseData["todos"] = JSON.parse(todoData);

      context.setVariable("response.content", JSON.stringify(responseData));
tests: []
