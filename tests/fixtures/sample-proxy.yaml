# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: sample-proxy
displayName: Sample Proxy
type: proxy
description: Simple proxy to mocktarget.apigee.net
endpoints:
  - name: default
    basePath: /sample
    routes:
      - name: default
        target: default
    flows:
      - name: PostFlow
        mode: Response
        steps:
          - name: AM-SetResponseHeader
targets:
  - name: default
    url: https://mocktarget.apigee.net
policies:
  - name: AM-SetResponseHeader
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetResponseHeader
        DisplayName: AM-SetResponseHeader
        Set:
          Headers:
            Header:
              metadata:
                name: x-hello
              _text: Hello world!
